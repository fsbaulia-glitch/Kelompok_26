<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya - TaskMate</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-sidebar: #f1f5f9;
      --primary: #4f46e5;
      --primary-light: #e0e7ff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --card-bg: #ffffff;
      --success-bg: #dcfce7;
      --success-text: #166534;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Styling */
    aside {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      position: fixed;
      height: 100vh;
    }

    .sidebar-top .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px 24px 12px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .logo-area img {
      width: 32px;
      height: 32px;
    }

    .logo-text h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    aside nav ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    aside nav ul li a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    aside nav ul li a:hover,
    aside nav ul li.active a {
      background-color: var(--primary);
      color: #ffffff;
    }

    .sidebar-bottom {
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .sidebar-bottom a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      color: #ef4444;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      border-radius: 8px;
    }

    .sidebar-bottom a:hover {
      background-color: #fee2e2;
    }

    /* Main Content Area */
    main {
      margin-left: 260px;
      flex: 1;
      padding: 24px 32px;
      max-width: calc(100vw - 260px);
    }

    /* Top Navigation Bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .search-bar {
      position: relative;
      width: 400px;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border: 1px solid var(--border-color);
      border-radius: 99px;
      font-size: 13px;
      background-color: #ffffff;
      outline: none;
    }

    .user-profile-nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: #ffffff;
      border: 1px solid var(--border-color);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .profile-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 4px 12px 4px 4px;
      border-radius: 99px;
    }

    .profile-pill img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-info-nav h4 {
      font-size: 13px;
      font-weight: 600;
    }

    /* Page Header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .page-header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .badge-verified {
      background-color: var(--success-bg);
      color: var(--success-text);
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* Profile Main Card */
    .profile-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .avatar-badge-icon {
      position: absolute;
      bottom: 0;
      right: 0;
      background: var(--primary);
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      border: 2px solid #fff;
    }

    .profile-details h2 {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .tag-active {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .profile-details p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .btn-edit-profile {
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-edit-profile:hover {
      background: var(--bg-sidebar);
    }

    /* Grid Layout for Bottom Sections */
    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 24px;
    }

    /* Account Information Box */
    .info-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
    }

    .info-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .info-box-header h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .info-box-header span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .info-list {
      display: flex;
      flex-direction: column;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .info-label {
      color: var(--text-muted);
      font-weight: 500;
    }

    .info-value {
      color: var(--text-main);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-primer {
      background: #f1f5f9;
      color: var(--text-muted);
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Right Column (Security & Task Summary) */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .security-box, .task-summary-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }

    .security-box h3, .task-summary-box h3 {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .security-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
    }

    .security-item:last-child {
      border-bottom: none;
    }

    .security-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .text-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .badge-active-green {
      color: #10b981;
      font-weight: 600;
      font-size: 12px;
    }

    /* Task Summary Specific Dark Card */
    .task-summary-box {
      background: #1e293b;
      color: #ffffff;
      border: none;
    }

    .task-summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .task-summary-header h3 {
      color: #fff;
      margin-bottom: 0;
      font-size: 14px;
    }

    .badge-semester {
      background: #334155;
      color: #cbd5e1;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .task-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .metric-card {
      background: #334155;
      padding: 12px;
      border-radius: 8px;
    }

    .metric-card .label {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .metric-card .value {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .metric-card .value.green {
      color: #34d399;
    }
  </style>
</head>
